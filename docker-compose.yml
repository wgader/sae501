# Développement local : docker compose up --build
#
#   http://localhost:3000        site (next dev, rechargement à chaud)
#   http://localhost:8000        Symfony seul (documentation de l'API : /api/docs)
#   http://localhost:8080        phpMyAdmin
#   http://localhost:8025        Mailpit (e-mails envoyés par l'application)
#
# Le navigateur ne parle qu'au port 3000 : next dev relaie /api vers Symfony (rewrites de
# frontend/next.config.ts), comme Caddy le fait en production sur un seul domaine.

services:
  frontend:
    image: node:26-alpine
    working_dir: /src
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DEV_BACKEND_URL: http://app
    volumes:
      - ./frontend:/src
      - /src/node_modules
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend

  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:80"
    env_file: .env
    volumes:
      - ./backend:/app/backend
      # Garde les dépendances installées dans l'image plutôt que le vendor/ de la machine.
      - /app/backend/vendor
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/healthcheck.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # Tâches planifiées (ouverture et fermeture des campagnes) : voir src/Scheduler/MaintenanceSchedule.php.
  worker:
    build:
      context: .
      target: dev
    command: php bin/console messenger:consume scheduler_default --time-limit=3600
    restart: unless-stopped
    # Pas de serveur web dans ce conteneur : le contrôle de santé de FrankenPHP n'a pas de sens.
    healthcheck:
      disable: true
    env_file: .env
    volumes:
      - ./backend:/app/backend
      - /app/backend/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    networks:
      - backend

# frontend : le serveur Next.js et Symfony. backend : Symfony, le worker et les outils de la base.
# MySQL n'est joignable que depuis backend.
networks:
  frontend:
  backend:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
