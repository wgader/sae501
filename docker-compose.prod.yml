services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/wgader/sae501/frontend}:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env.prod}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/wgader/sae501/backend}:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      SERVER_NAME: ${API_DOMAIN:?Set API_DOMAIN in .env.prod}
      SERVER_ROOT: /app/public
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backend_uploads:/app/public/uploads
      - caddy_data:/data
      - caddy_config:/config
    secrets:
      - source: jwt_private_key
        target: /run/secrets/jwt_private_key
      - source: jwt_public_key
        target: /run/secrets/jwt_public_key
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app_network
      - db_network

  campaign-scheduler:
    image: ${BACKEND_IMAGE:-ghcr.io/wgader/sae501/backend}:${IMAGE_TAG:-latest}
    init: true
    restart: unless-stopped
    command: sh -c "while true; do php bin/console app:campaigns:synchronize --env=prod --no-interaction; sleep 60; done"
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db_network

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db_network

networks:
  app_network:
  db_network:
    internal: true

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
  mysql_data:

secrets:
  jwt_private_key:
    file: ./secrets/jwt/private.pem
  jwt_public_key:
    file: ./secrets/jwt/public.pem
