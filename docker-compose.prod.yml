# Pile de préproduction ou de production : un projet Compose par environnement.
#
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# Le fichier d’environnement fixe COMPOSE_PROJECT_NAME (sae501-preprod ou sae501-prod) : tous les
# volumes et réseaux portent ce préfixe explicitement, si bien que les données d’un environnement
# ne peuvent pas être montées par l’autre, même avec une option -p erronée.
# Les étiquettes d’images (BACKEND_IMAGE_TAG, FRONTEND_IMAGE_TAG) sont fournies par
# docker/deploy/deploy.sh ; aucune étiquette mobile comme latest n’est utilisée par défaut.
# Aucun outil de développement (phpMyAdmin, Mailpit) n’est défini ici, et aucun port n’est publié :
# seul le proxy d’entrée (docker/deploy/edge) écoute sur 80/443 et joint le réseau edge du projet.

name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME (sae501-preprod or sae501-prod)}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-hardening: &hardening
  init: true
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Variables lues par Symfony. Chaque service ne reçoit que ce dont il a besoin : le mot de passe
# root MySQL n’est transmis qu’au conteneur MySQL.
x-backend-environment: &backend-environment
  APP_ENV: prod
  APP_DEBUG: "0"
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
  # Mots de passe générés en hexadécimal par bootstrap-server.sh : aucun encodage d’URL nécessaire.
  DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:?}?serverVersion=8.4&charset=utf8mb4
  CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?Set CORS_ALLOW_ORIGIN}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
  MAILER_DSN: ${MAILER_DSN:?Set MAILER_DSN}
  MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
  JWT_SECRET_KEY: /run/secrets/jwt_private_key
  JWT_PUBLIC_KEY: /run/secrets/jwt_public_key
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
  # Le proxy d’entrée est sur un réseau Docker privé : Symfony lit l’IP du client et le schéma
  # HTTPS dans X-Forwarded-*, indispensable aux limiteurs de débit par IP.
  SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-private_ranges}

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-ghcr.io/wgader/sae501/backend}:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG (deploy.sh does it)}

services:
  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:-ghcr.io/wgader/sae501/frontend}:${FRONTEND_IMAGE_TAG:?Set FRONTEND_IMAGE_TAG (deploy.sh does it)}
    # NEXT_PUBLIC_API_URL est figée dans l’image au build (variable GitHub PUBLIC_API_URL de
    # l’environnement) : elle n’est pas lue à l’exécution.
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-frontend

  backend:
    <<: [*hardening, *backend-image]
    # Seule capacité conservée : écouter sur le port 80 (fichier frankenphp marqué par setcap).
    cap_add:
      - NET_BIND_SERVICE
    environment:
      <<: *backend-environment
      # HTTP seul : TLS est terminé par le proxy d’entrée.
      SERVER_NAME: ":80"
    volumes:
      # Images publiques (salles, matériel) servies par Caddy.
      - backend_uploads:/app/public/uploads
      # Justificatifs et fichiers d’événement, hors racine web ; doivent survivre aux redéploiements.
      - backend_private_uploads:/app/var/uploads
      - caddy_data:/data
      - caddy_config:/config
    # Fichiers lisibles par le groupe de l’utilisateur du conteneur (voir bootstrap-server.sh).
    secrets:
      - source: jwt_private_key
        target: /run/secrets/jwt_private_key
      - source: jwt_public_key
        target: /run/secrets/jwt_public_key
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      default:
      db_network:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-backend

  campaign-scheduler:
    <<: [*hardening, *backend-image]
    command: sh -c "while true; do php bin/console app:campaigns:synchronize --env=prod --no-interaction; sleep 60; done"
    environment: *backend-environment
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - db_network

  # Traite les messages asynchrones (notifications de réservation) ; redémarre toutes les heures
  # pour libérer la mémoire et prendre en compte un nouveau déploiement.
  messenger-worker:
    <<: [*hardening, *backend-image]
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --env=prod --no-interaction
    environment: *backend-environment
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      # default : accès sortant vers Brevo ; db_network : accès à MySQL.
      - default
      - db_network

  mysql:
    image: mysql:8.4
    init: true
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Ping en TCP : le serveur temporaire lancé pendant l’initialisation de la base écoute sans
    # réseau et ne doit pas être considéré comme prêt (il s’arrête juste après).
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - db_network

networks:
  # Sortie Internet (Brevo) ; aucun port publié.
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
  # MySQL n’est joignable que depuis ce réseau, sans accès extérieur.
  db_network:
    name: ${COMPOSE_PROJECT_NAME}_db
    internal: true
  # Réseau partagé avec le proxy d’entrée, propre à cet environnement ; créé par
  # bootstrap-server.sh ou deploy.sh.
  edge:
    name: ${COMPOSE_PROJECT_NAME}_edge
    external: true

volumes:
  backend_uploads:
    name: ${COMPOSE_PROJECT_NAME}_backend_uploads
  backend_private_uploads:
    name: ${COMPOSE_PROJECT_NAME}_backend_private_uploads
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME}_mysql_data

secrets:
  jwt_private_key:
    file: ./secrets/jwt/private.pem
  jwt_public_key:
    file: ./secrets/jwt/public.pem
