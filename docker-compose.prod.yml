# Préproduction ou production sur le VPS (un projet Compose par environnement) :
#
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# Lancé par docker/deploy/deploy.sh, qui fournit APP_IMAGE_TAG. COMPOSE_PROJECT_NAME
# (sae501-preprod ou sae501-prod) préfixe volumes et réseaux : un environnement ne peut pas
# monter les données de l'autre. Aucun port n'est publié : le proxy d'entrée (docker/deploy/edge)
# termine HTTPS et transmet tout le domaine au service app.

name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME (sae501-preprod or sae501-prod)}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-hardening: &hardening
  init: true
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-image: &app-image
  image: ${APP_IMAGE:-ghcr.io/wgader/sae501/app}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG (deploy.sh does it)}

# Variables de Symfony, communes au site et au worker.
x-symfony-environment: &symfony-environment
  APP_ENV: prod
  APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
  DATABASE_URL: mysql://${MYSQL_USER:?}:${MYSQL_PASSWORD:?}@mysql:3306/${MYSQL_DATABASE:?}?serverVersion=8.4&charset=utf8mb4
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
  MAILER_DSN: ${MAILER_DSN:?Set MAILER_DSN}
  MAILER_FROM: ${MAILER_FROM:?Set MAILER_FROM}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
  JWT_SECRET_KEY: /run/secrets/jwt_private_key
  JWT_PUBLIC_KEY: /run/secrets/jwt_public_key
  JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
  JWT_COOKIE_SECURE: "1"
  # Antivirus des fichiers déposés : vide = désactivé (voir le service clamav).
  CLAMAV_DSN: ${CLAMAV_DSN:-}
  # Le proxy d'entrée est sur un réseau privé : Symfony lit l'IP du visiteur dans X-Forwarded-For.
  SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-private_ranges}

x-jwt-secrets: &jwt-secrets
  secrets:
    - source: jwt_private_key
      target: /run/secrets/jwt_private_key
    - source: jwt_public_key
      target: /run/secrets/jwt_public_key

services:
  # Caddy + FrankenPHP : pages du front et API Symfony sur le même domaine.
  app:
    <<: [*hardening, *app-image, *jwt-secrets]
    cap_add:
      - NET_BIND_SERVICE
    environment:
      <<: *symfony-environment
      FRANKENPHP_WORKERS: ${FRANKENPHP_WORKERS:-2}
    mem_limit: ${APP_MEM_LIMIT:-512m}
    volumes:
      # Images et justificatifs, hors de la racine web : Symfony les sert après contrôle des droits.
      - uploads:/app/backend/var/media
      - private_uploads:/app/backend/var/uploads
      # Journaux de Caddy (access.log, error.log) et de Symfony, conservés entre deux déploiements.
      - logs:/app/backend/var/log
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME}-app
      backend:
      internet:

  # Même image : envoie les notifications en file d'attente et lance les tâches planifiées.
  # --time-limit le redémarre chaque heure pour libérer la mémoire.
  worker:
    <<: [*hardening, *app-image, *jwt-secrets]
    command: php bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=160M --no-interaction
    environment: *symfony-environment
    mem_limit: ${WORKER_MEM_LIMIT:-256m}
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - internet

  mysql:
    image: mysql:8.4
    # Réglé pour un petit VPS partagé par la préproduction et la production.
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL:-128M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-40}
      - --skip-name-resolve
    mem_limit: ${MYSQL_MEM_LIMIT:-512m}
    init: true
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # En TCP : pendant sa première initialisation, MySQL écoute sans réseau et n'est pas encore prêt.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      - backend

  # Antivirus facultatif (environ 1 Go de mémoire) : COMPOSE_PROFILES=antivirus et
  # CLAMAV_DSN=tcp://clamav:3310 dans .env.
  clamav:
    image: clamav/clamav:1.5.3
    profiles: [antivirus]
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-1536m}
    # Le premier chargement des signatures dépasse le délai d'attente du déploiement.
    healthcheck:
      disable: true
    volumes:
      - clamav_data:/var/lib/clamav
    logging: *logging
    networks:
      - backend
      - internet

networks:
  # Partagé avec le proxy d'entrée ; créé par deploy.sh.
  edge:
    name: ${COMPOSE_PROJECT_NAME}_edge
    external: true
  # Sans accès à Internet : seul chemin vers MySQL.
  backend:
    name: ${COMPOSE_PROJECT_NAME}_backend
    internal: true
  # Sortie vers Internet (Brevo pour les e-mails, mises à jour de l'antivirus).
  internet:
    name: ${COMPOSE_PROJECT_NAME}_internet

# Les noms des volumes de données sont ceux des versions précédentes : un déploiement les reprend.
volumes:
  uploads:
    name: ${COMPOSE_PROJECT_NAME}_backend_uploads
  private_uploads:
    name: ${COMPOSE_PROJECT_NAME}_backend_private_uploads
  logs:
    name: ${COMPOSE_PROJECT_NAME}_logs
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME}_caddy_config
  mysql_data:
    name: ${COMPOSE_PROJECT_NAME}_mysql_data
  clamav_data:
    name: ${COMPOSE_PROJECT_NAME}_clamav_data

secrets:
  jwt_private_key:
    file: ./secrets/jwt/private.pem
  jwt_public_key:
    file: ./secrets/jwt/public.pem
