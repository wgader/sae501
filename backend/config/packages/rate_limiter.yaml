framework:
    rate_limiter:
        # Inscription : 5 tentatives par IP sur 15 minutes
        register_association:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # Vérification email : 5 tentatives par IP sur 15 minutes
        verify_email:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # Mot de passe oublié : 5 demandes ou confirmations par IP sur 15 minutes
        password_reset:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # Activation de compte et renvoi du lien : 10 tentatives par IP sur 15 minutes
        account_activation:
            policy: 'fixed_window'
            limit: 10
            interval: '15 minutes'

        # Formulaire de contact : 5 envois par IP sur 15 minutes
        contact_message:
            policy: 'fixed_window'
            limit: 5
            interval: '15 minutes'

        # Connexion mairie : 5 échecs par compte et par IP, 25 par IP, sur 15 minutes
        admin_login_account:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

        admin_login_ip:
            policy: 'sliding_window'
            limit: 25
            interval: '15 minutes'
