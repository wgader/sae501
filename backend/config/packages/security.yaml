security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # Un administrateur dispose de tous les modules, sans avoir à les cumuler sur son compte.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_GESTION_EVENT, ROLE_GESTION_SUBVENTION, ROLE_GESTION_MATERIEL, ROLE_GESTION_SALLE]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/auth/login
            stateless: true
            user_checker: App\Security\AccountStatusChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Contre le test massif de mots de passe : 5 échecs par compte et par IP sur 15 minutes
            # (et 25 par IP tous comptes confondus) ; réponse 429 en français (LoginThrottlingListener).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # /uploads : les images ne sont servies qu'aux comptes connectés (MediaController).
        api:
            pattern: ^/(api|uploads)(/|$)
            stateless: true
            user_checker: App\Security\AccountStatusChecker
            jwt: ~

    access_control:
        - { path: ^/api/auth/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/activate, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/resend-activation, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/password-reset/(request|confirm)$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/public(/|$), roles: PUBLIC_ACCESS }
        # Chaque agent n'atteint que les routes de ses modules ; ROLE_ADMIN les hérite toutes.
        - { path: ^/api/admin/(campaigns|campaign-history|campaign-wishes|room-requests|salles), roles: ROLE_GESTION_SALLE }
        - { path: ^/api/admin/equipment, roles: ROLE_GESTION_MATERIEL }
        - { path: ^/api/admin/grants, roles: ROLE_GESTION_SUBVENTION }
        - { path: ^/api/admin/associations/\d+/requests/[^/]+/request-documents$, allow_if: "is_granted('ROLE_GESTION_MATERIEL') or is_granted('ROLE_GESTION_SALLE')", methods: [POST] }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/(api|uploads)(/|$), roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
