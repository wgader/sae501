api_platform:
    title: Plateforme associations - API
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

# En production, la documentation OpenAPI n’est pas publiée : elle décrirait toute la surface de
# l’API à un attaquant. Elle reste disponible en développement et en CI.
when@prod:
    api_platform:
        enable_docs: false
        enable_swagger_ui: false
        enable_re_doc: false
