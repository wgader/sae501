monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - audit # Journal de sécurité (SecurityAuditLogger) : connexions, mots de passe, rôles

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # Les requêtes SQL et leurs paramètres (données personnelles) ne sont jamais vidés dans les journaux.
                channels: ["!deprecation", "!audit", "!doctrine"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            # Le journal de sécurité est toujours écrit, même sans erreur dans la requête.
            audit:
                type: stream
                path: php://stderr
                level: info
                channels: [audit]
                formatter: monolog.formatter.json
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Journal applicatif sur disque (var/log/prod-AAAA-MM-JJ.log) : connexions, actions
            # de l'audit, avertissements et erreurs. Un fichier par jour, gardé 30 jours.
            app_file:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: info
                max_files: 30
                # security est exclu : il écrit l'adresse e-mail ; l'audit garde l'identifiant.
                channels: ["!event", "!doctrine", "!deprecation", "!request", "!cache", "!security"]
                formatter: monolog.formatter.json
