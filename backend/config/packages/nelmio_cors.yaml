nelmio_cors:
    defaults:
        origin_regex: true
        # Expression régulière fournie par l’environnement : localhost en dev, domaine réel en production.
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        # Le cookie de session doit accompagner les appels du frontend.
        allow_credentials: true
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/': ~