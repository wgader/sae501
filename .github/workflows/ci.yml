name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: Symfony — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Créer le .env pour CI
        run: |
          echo "APP_ENV=test" > backend/.env
          echo "APP_SECRET=secret_for_ci_only" >> backend/.env

      - name: Install deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      - name: Composer audit
        run: composer audit --working-dir=backend

      - name: PHPStan
        run: cd backend && vendor/bin/phpstan analyse --no-progress

      - name: Generate JWT test keys
        run: |
          mkdir -p backend/config/jwt
          openssl genpkey -out backend/config/jwt/private.pem -pass pass:test_passphrase -aes256 -algorithm rsa -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in backend/config/jwt/private.pem -passin pass:test_passphrase -pubout -out backend/config/jwt/public.pem

      - name: PHPUnit
        run: cd backend && php bin/phpunit
        env:
          JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
          JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
          JWT_PASSPHRASE: 'test_passphrase'

  frontend:
    name: Next.js — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - name: NPM audit
        run: npm audit --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npm --prefix frontend run test:e2e
