name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Les jobs ne font que lire le dépôt ; toute permission d’écriture doit être accordée job par job.
permissions:
  contents: read

jobs:
  backend:
    name: Symfony — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Créer le .env pour CI
        run: |
          echo "APP_ENV=test" > backend/.env
          echo "APP_SECRET=secret_for_ci_only" >> backend/.env

      - name: Install deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      - name: Composer audit
        run: composer audit --working-dir=backend

      - name: PHPStan
        run: cd backend && vendor/bin/phpstan analyse --no-progress

      # Les clés JWT jetables des tests sont générées par backend/tests/bootstrap.php.
      - name: PHPUnit
        run: cd backend && php bin/phpunit

  migrations:
    name: Doctrine — migrations on an empty MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sae501_ci
          MYSQL_USER: ci
          # Identifiants factices, valables uniquement pour la base éphémère de la CI.
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: dev
      DATABASE_URL: mysql://ci:ci_password@127.0.0.1:3306/sae501_ci?serverVersion=8.4&charset=utf8mb4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Install deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      # Une chaîne cassée (par exemple une table créée deux fois) doit échouer ici, pas pendant un déploiement.
      - name: Apply all migrations
        run: cd backend && php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

      - name: Schema matches the mapping
        run: cd backend && php bin/console doctrine:schema:validate --no-interaction

      - name: Migrations can be rolled back and reapplied
        run: |
          cd backend
          php bin/console doctrine:migrations:migrate first --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate --no-interaction

  frontend:
    name: Next.js — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - name: NPM audit
        run: npm audit --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      - name: Run Playwright E2E tests
        run: npm --prefix frontend run test:e2e
