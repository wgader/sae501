name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Les jobs ne font que lire le dépôt ; toute permission d’écriture doit être accordée job par job.
permissions:
  contents: read

jobs:
  backend:
    name: Symfony — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Créer le .env pour CI
        run: |
          echo "APP_ENV=test" > backend/.env
          echo "APP_SECRET=secret_for_ci_only" >> backend/.env

      - name: Install deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      - name: Composer audit
        run: composer audit --working-dir=backend

      - name: PHPStan
        run: cd backend && vendor/bin/phpstan analyse --no-progress

      # Les clés JWT jetables des tests sont générées par backend/tests/bootstrap.php.
      - name: PHPUnit
        run: cd backend && php bin/phpunit

  migrations:
    name: Doctrine — migrations on an empty MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sae501_ci
          MYSQL_USER: ci
          # Identifiants factices, valables uniquement pour la base éphémère de la CI.
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: dev
      DATABASE_URL: mysql://ci:ci_password@127.0.0.1:3306/sae501_ci?serverVersion=8.4&charset=utf8mb4
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Install deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      # Une chaîne cassée (par exemple une table créée deux fois) doit échouer ici, pas pendant un déploiement.
      - name: Apply all migrations
        run: cd backend && php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

      - name: Schema matches the mapping
        run: cd backend && php bin/console doctrine:schema:validate --no-interaction

      - name: Migrations can be rolled back and reapplied
        run: |
          cd backend
          php bin/console doctrine:migrations:migrate first --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate --no-interaction

  frontend:
    name: Next.js — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - name: NPM audit
        run: npm audit --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  # L’image de production (dépendances sans dev, utilisateur non privilégié) est construite et
  # démarrée avant la fusion : la CD publie ensuite ce même Dockerfile.
  backend-image:
    name: Image backend — build prod + exécution non-root
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build the production stage
        run: docker build --file docker/backend/Dockerfile --target prod --tag sae501-backend:ci .

      - name: Run without root and answer the healthcheck
        run: |
          docker run --detach --name backend-ci --cap-drop ALL --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true sae501-backend:ci
          test "$(docker exec backend-ci id -u)" != "0"
          docker exec backend-ci sh -c 'test ! -w /app/src && test ! -w /app/vendor && test -w /app/var && test -w /app/public/uploads'
          docker exec backend-ci sh -c '! command -v composer'
          for _ in $(seq 1 30); do
            docker exec backend-ci curl --fail --silent --output /dev/null http://localhost/healthcheck.php && exit 0
            sleep 2
          done
          docker logs backend-ci
          exit 1

  e2e:
    name: Playwright — parcours complets (Chromium)
    runs-on: ubuntu-latest
    # Garde-fou : une API indisponible ne doit plus bloquer la CI pendant des dizaines de minutes.
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sae501_e2e
          MYSQL_USER: ci
          # Identifiants factices, valables uniquement pour la base éphémère de la CI.
          MYSQL_PASSWORD: ci_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: dev
      DATABASE_URL: mysql://ci:ci_password@127.0.0.1:3306/sae501_e2e?serverVersion=8.4&charset=utf8mb4
      # Aucun e-mail réel n’est envoyé et les messages asynchrones sont traités immédiatement.
      MAILER_DSN: null://null
      MAILER_FROM: no-reply@example.test
      MESSENGER_TRANSPORT_DSN: sync://
      FRONTEND_URL: http://localhost:3000
      JWT_PASSPHRASE: ''
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Comptes de démonstration créés par backend/src/DataFixtures/AppFixtures.php.
      TEST_ADMIN_EMAIL: admin@feytiat.test
      TEST_USER_EMAIL: antonio.alves@feytiat.test
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, intl, zip
          coverage: none

      - name: Install backend deps
        run: composer install --working-dir=backend --prefer-dist --no-progress --no-scripts

      - name: Generate disposable JWT keys
        run: |
          mkdir -p backend/config/jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out backend/config/jwt/private.pem
          openssl pkey -in backend/config/jwt/private.pem -pubout -out backend/config/jwt/public.pem

      # Mot de passe des comptes de démonstration tiré au hasard à chaque exécution, masqué dans les journaux.
      - name: Generate demo credentials
        run: |
          password="Aa1$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          {
            echo "FIXTURES_PASSWORD=$password"
            echo "TEST_ADMIN_PASSWORD=$password"
            echo "TEST_USER_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Prepare the database
        run: |
          cd backend
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:fixtures:load --no-interaction

      # Le serveur intégré de PHP n’expose les variables d’environnement qu’avec variables_order=EGPCS.
      - name: Start the API
        run: |
          cd backend
          nohup php -d variables_order=EGPCS -S 127.0.0.1:8000 -t public > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/api/docs && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: frontend

      - name: Keep the Playwright report and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
          retention-days: 7

  security:
    name: Sécurité — secrets, dépendances, Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks analyse tout l’historique, pas seulement le dernier commit.
          fetch-depth: 0

      - name: Prepare report folder
        run: mkdir -p security-reports

      # Les constats déjà analysés sont listés par empreinte dans .gitleaksignore.
      - name: Gitleaks (secrets)
        id: gitleaks
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner
          --gitleaks-ignore-path /repo/.gitleaksignore
          --report-format json --report-path /repo/security-reports/gitleaks.json

      - name: Trivy (dépendances et configuration)
        id: trivy
        continue-on-error: true
        run: |
          trivy() {
            docker run --rm -v "$PWD:/repo" -v trivy-cache:/root/.cache aquasec/trivy:0.76.2 \
              fs --quiet --scanners vuln,misconfig --skip-dirs "/repo/frontend/sprint 2" "$@" /repo
          }
          # Rapport complet HIGH et CRITICAL, puis échec uniquement sur CRITICAL.
          trivy --severity HIGH,CRITICAL --format json --output /repo/security-reports/trivy.json
          trivy --severity CRITICAL --exit-code 1

      - name: Hadolint (Dockerfiles)
        id: hadolint
        continue-on-error: true
        run: |
          status=0
          for name in backend frontend; do
            docker run --rm -i hadolint/hadolint:v2.15.1-alpine hadolint --no-color --failure-threshold error - \
              < "docker/$name/Dockerfile" > "security-reports/hadolint-$name.txt" 2>&1 || status=1
          done
          exit $status

      # Analyse statique du code (bearer.yml, exceptions justifiées dans bearer.ignore) :
      # rapport complet, échec sur HIGH et CRITICAL.
      - name: Bearer (SAST)
        id: bearer
        continue-on-error: true
        run: |
          bearer() {
            docker run --rm -v "$PWD:/repo" -w /repo bearer/bearer:v1.51.1 scan /repo --quiet --config-file /repo/bearer.yml "$@"
          }
          # L’image Bearer n’est pas root : le rapport passe par la sortie standard.
          bearer --format json --exit-code 0 > security-reports/bearer.json
          bearer --severity critical,high --exit-code 1 > /dev/null

      # Inventaire des composants (CycloneDX), conservé avec le rapport : non bloquant.
      - name: Syft (SBOM)
        id: syft
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/repo" anchore/syft:v1.38.0 scan dir:/repo
          --exclude "./frontend/sprint 2" --exclude ./backend/var --quiet
          --output cyclonedx-json=/repo/security-reports/sbom.cdx.json

      - name: Build SECURITY-REPORT.md
        if: always()
        run: |
          python3 -I .github/scripts/security_report.py security-reports \
            "gitleaks=${{ steps.gitleaks.outcome }}" "trivy=${{ steps.trivy.outcome }}" \
            "hadolint=${{ steps.hadolint.outcome }}" "bearer=${{ steps.bearer.outcome }}" "syft=${{ steps.syft.outcome }}" \
            > security-reports/SECURITY-REPORT.md
          cat security-reports/SECURITY-REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: security-reports
          retention-days: 30

      # Le rapport est toujours publié avant d’appliquer les seuils bloquants.
      - name: Apply blocking thresholds
        if: always()
        run: |
          failed=0
          # Le SBOM est informatif : il ne bloque pas.
          for outcome in "${{ steps.gitleaks.outcome }}" "${{ steps.trivy.outcome }}" "${{ steps.hadolint.outcome }}" "${{ steps.bearer.outcome }}"; do
            [ "$outcome" = "success" ] || failed=1
          done
          exit $failed
